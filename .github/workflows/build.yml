name: Build Android .so

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        echo "Setting up NDK..."
        ANDROID_NDK_PATH=$ANDROID_HOME/ndk/26.3.11579264
        if [ ! -d "$ANDROID_NDK_PATH" ]; then
          sdkmanager --install "ndk;26.3.11579264"
          ANDROID_NDK_PATH=$ANDROID_HOME/ndk/26.3.11579264
        fi
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_NDK_PATH" >> $GITHUB_ENV

    - name: Download Dear ImGui
      run: |
        curl -sL https://github.com/ocornut/imgui/archive/refs/tags/v1.90.1.zip -o imgui.zip
        unzip -q imgui.zip
        mv imgui-1.90.1/* .

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=armeabi-v7a \
              -DANDROID_PLATFORM=android-21 \
              ..

    - name: Build project
      run: |
        cd build
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-so-file
        path: build/*.so
